name: Build

on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
      profile:
        type: string
        required: true

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x86_64
          - os: windows-latest
            target: windows-x86_64
          - os: macos-latest
            target: macos-aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - name: Install the Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig-dev libfreetype-dev libvulkan-dev \
            libwayland-dev libx11-xcb-dev libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ inputs.profile }}
      - name: Build lean
        run: cargo build --locked --profile ${{ inputs.profile }}
      - name: Package lean
        shell: bash
        run: |
          name="lean-${{ matrix.target }}"
          mkdir -p "package/$name" out
          cp README.md LICENSE "package/$name/"
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp "target/${{ inputs.profile }}/lean.exe" "package/$name/"
            (cd package && 7z a "../out/$name.zip" "$name")
          else
            cp "target/${{ inputs.profile }}/lean" "package/$name/"
            tar -C package -czf "out/$name.tar.gz" "$name"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: lean-${{ matrix.target }}
          path: out/*
          if-no-files-found: error
