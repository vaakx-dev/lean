name: Nightly

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency: nightly

jobs:
  changed:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.changed.outputs.build }}
      commit: ${{ steps.changed.outputs.commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Skip when main has not changed
        id: changed
        run: |
          commit="$(git rev-parse HEAD)"
          built="$(git rev-parse -q --verify 'refs/tags/nightly^{commit}' || true)"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          if [ "$built" != "$commit" ]; then echo "build=true" >> "$GITHUB_OUTPUT"; fi

  release:
    needs: changed
    if: needs.changed.outputs.build == 'true'
    uses: ./.github/workflows/rolling-release.yml
    with:
      channel: nightly
      commit: ${{ needs.changed.outputs.commit }}
      schedule: at most once a day when main changes
