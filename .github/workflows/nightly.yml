name: Nightly

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency: nightly

jobs:
  changed:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.changed.outputs.build }}
      commit: ${{ steps.changed.outputs.commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Skip when main has not changed
        id: changed
        run: |
          commit="$(git rev-parse HEAD)"
          built="$(git rev-parse -q --verify 'refs/tags/nightly^{commit}' || true)"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          if [ "$built" != "$commit" ]; then echo "build=true" >> "$GITHUB_OUTPUT"; fi

  build:
    needs: changed
    if: needs.changed.outputs.build == 'true'
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ needs.changed.outputs.commit }}
      profile: release

  publish:
    needs: [changed, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: lean-*
          path: assets
          merge-multiple: true
      - name: Write the checksums
        run: cd assets && sha256sum * > SHA256SUMS
      - name: Move the nightly release to main
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT: ${{ needs.changed.outputs.commit }}
        run: |
          gh release delete nightly --cleanup-tag --yes || true
          gh release create nightly --target "$COMMIT" --prerelease --latest=false \
            --title "Nightly $(date -u +%Y-%m-%d)" \
            --notes "Built from ${COMMIT:0:7} on main. This release moves at most once a day when main changes." \
            assets/*
