[workspace]
resolver = "2"
members = ["crates/lean"]
default-members = ["crates/lean"]

[workspace.package]
edition = "2024"
publish = false
license = "MIT"

[workspace.dependencies]
anyhow = "1"
gpui-kit = { version = "=0.7.1", features = ["tree-sitter-languages"] }
git2 = { version = "0.20", default-features = false }
log = "0.4"
env_logger = "0.11"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 16
