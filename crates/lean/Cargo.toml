[package]
name = "lean"
version = "0.1.0"
description = "A small, fast native code editor built with GPUI"
readme = "../../README.md"
keywords = ["editor", "gpui", "code-editor", "terminal", "git"]
categories = ["text-editors", "development-tools"]
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[[bin]]
name = "lean"
path = "src/main.rs"

[features]
default = ["git", "notebook", "search", "media", "browser"]
notebook = ["dep:base64", "dep:jupyter-protocol", "dep:runtimelib", "dep:tokio"]
git = ["dep:git2"]
search = ["dep:regex"]
media = []
browser = []

[dependencies]
alacritty_terminal = "0.26.0"
anyhow.workspace = true
base64 = { version = "0.22", optional = true }
dirs = "6"
dunce = "1"
env_logger.workspace = true
futures = "0.3"
git2 = { workspace = true, optional = true }
gpui-kit.workspace = true
ignore = "0.4"
jupyter-protocol = { version = "1.4", optional = true }
log.workspace = true
notify = "8.2"
regex = { version = "1", optional = true }
ropey = { version = "=2.0.0-beta.1", default-features = false }
runtimelib = { version = "1.4", features = ["tokio-runtime"], optional = true }
rust-embed = { version = "8", features = ["include-exclude"] }
self-replace = "1.5.0"
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "process", "time", "fs", "io-util", "macros"], optional = true }
trash = "5.2.9"
ureq = { version = "3.4.2", features = ["json"] }
uuid = { version = "1", features = ["v4"] }

[target."cfg(windows)".dependencies]
zip = { version = "9.0.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target."cfg(not(windows))".dependencies]
flate2 = "1.1.10"
tar = "0.4.46"
